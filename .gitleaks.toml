# Phase P3.5 (2026-02) — gitleaks configuration.
#
# Inherits the gitleaks default rule set. Adds a small allowlist for
# patterns we know are public/test data and would otherwise create
# false-positive failures on every push.

title = "AKKI gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "AKKI known-safe patterns"

# Public OAuth client IDs are not secrets (the spec calls them public).
# Microsoft Graph / Google OAuth client IDs ride in plain text in the
# frontend bundle anyway.
regexes = [
  '''MICROSOFT_OAUTH_CLIENT_ID\s*=\s*[a-zA-Z0-9-]{36}''',
  '''GOOGLE_OAUTH_CLIENT_ID\s*=\s*[a-zA-Z0-9-]+\.apps\.googleusercontent\.com''',
  # Test JWTs we ship in pytest fixtures — clearly labelled, fixed value.
  '''eyJhbGciOiJIUzI1NiJ9\.[A-Za-z0-9_-]{0,64}\.[A-Za-z0-9_-]{0,64}''',
]

# Test files only — production code never holds raw secrets.
paths = [
  '''^backend/tests/.*''',
  '''^frontend/.*\.test\.(js|jsx|ts|tsx)$''',
  '''^/tmp/.*''',
  '''^\.github/workflows/gitleaks\.yml$''',
  '''^\.gitleaks\.toml$''',
  # frontend STORAGE_KEY constants — these are localStorage keys, not secrets.
  '''^frontend/src/components/cohort/Day16Banner\.jsx$''',
  # placeholder tokens <pass>, <PROD_ATLAS_URI> in production env runbook
  '''^docs/RUNBOOKS/PRODUCTION_ENV\.md$''',
  # deployment doc placeholder tokens
  '''^docs/DEPLOYMENT\.md$''',
  # product spec placeholder tokens
  '''^docs/PRODUCT_SPEC\.md$''',
  # SG.fake-key-for-warning-check fixture used by provider health test
  '''^backend/tests/test_admin_email_provider_health\.py$''',
  # Azure engineer request notes containing documented placeholder secrets
  '''^memory/user_actions/AZURE_ENGINEER_REQUEST.*\.md$''',
  # AKKI Audit (P1.5, 2026-06-24) — sprint memos + audit memos quote
  # redaction markers (`<REDACTED_ROTATE_AFTER_LEAK>`) and
  # already-rotated basic-auth USER identifiers (`BASIC_AUTH_USER=...`,
  # not the secret) for forensic completeness. These are
  # documentation, not live credentials. Same allowlist class as the
  # below per-path override for test_credentials.md.
  '''^memory/sprints/.*\.md$''',
  '''^memory/audit/.*\.md$''',
  '''^docs/PRODUCT_REVIEW\.md$''',
  # JC-ADMIN-CRED-ROTATION (2026-07-04) — proving slices + one-shot
  # rotation utilities carry fingerprint hex prefixes (12-char sha256
  # slices) + split-literal ("Akki" + "Admin" + ...) references + env
  # variable NAMES like `ADMIN_SEED_PASSWORD` (name only, never value).
  # These are legitimate CI/QA artefacts, not live credentials. Path-
  # scoped narrowly to the JC proving-slice + rotation-script naming
  # conventions — NOT a wildcard.
  '''^backend/scripts/jc_[a-z0-9_]+_proving_slice\.py$''',
  '''^backend/scripts/rotate_admin_password_[0-9_]+\.py$''',
]

# Per-path overrides for known-safe files.
[[allowlists]]
description = "Allow the seeded admin test password in test_credentials.md"
paths = ['''^memory/test_credentials\.md$''']
