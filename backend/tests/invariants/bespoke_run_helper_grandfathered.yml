# bespoke_run_helper_grandfathered.yml
#
# Canonical Spec: /app/memory/sprints/P5_7_FIX_SCOPE_CLUSTER_F.md §1.1
#                 (Cluster-F sub-sprints F.3, F.4, F.5, F.6 ship the
#                 mechanical sync→async conversion; this invariant
#                 prevents the anti-pattern from re-introducing itself
#                 in NEW test files AND tracks the closure of existing
#                 polluter files)
# Sprint memo:    /app/memory/sprints/INVARIANT_NO_BESPOKE_RUN_HELPER.md
# Seeded by:      backend/scripts/jc_invariant_bespoke_run_helper_slice.py
#                 baseline scan 2026-06-27 03:30 UTC
#
# This file grandfathers existing M1 + M2 polluter sites that existed
# BEFORE the invariant shipped. The invariant catches two patterns:
#
#   M1: module-level `def _run(coro): return asyncio.get_event_loop()
#       .run_until_complete(coro)` helper — the Cluster-E / Cluster-F
#       wrong-loop-binding anti-pattern. 13 files currently carry this.
#
#   M2: `asyncio.run(...)` call inside a `test_*` function body —
#       different fix shape (policy mutation / pure-Python pipeline
#       call), but same broad-suite landmine risk. 28 sites across
#       10 files currently carry this.
#
# Two-tier exemption (same shape as thin-assertion guard):
#
#   (a) **File-based grandfather list** — this file. Entries roll up
#       to Cluster-F sub-sprint dispatches (F.3, F.4, F.5, F.6) for
#       M1 closure; M2 sites that aren't Cluster-F-scoped need their
#       own follow-up sprint to evaluate.
#
#   (b) **In-source marker** — `@pytest.mark.acceptable_bespoke_run`
#       + a `# reason:` comment within 3 lines of the offending call /
#       helper def. For genuinely intentional uses (e.g. pure-Python
#       coroutine that has no Motor I/O and is verified loop-isolated).
#
# REMOVAL PROTOCOL: when a Cluster-F sub-sprint ships, its target
# files MUST be removed from this YAML simultaneously. The companion
# drift detector (test_grandfather_list_does_not_drift) will FAIL the
# build if a file appears here but the pattern is no longer present
# (i.e. test was converted but the grandfather entry forgotten).
#
# ─────────────────────────────────────────────────────────────────────
# DISCOVERY NOTE (2026-06-27): the Cluster-F scope memo §0 surveyed
# 14 files. This invariant's baseline scan surfaced 23 distinct files
# carrying the M1 / M2 patterns — 9 MORE than the scope memo
# identified. Documented as a scope-correction finding in the sprint
# memo. Closure trajectory: F.2 (3 files) + F.1 (2 files) shipped;
# F.3 + F.4 + F.5 + F.6 will close 9 more M1 + 1 M2 file = 10 files;
# the additional 5 M1 (rate_limits, mfa, cohort_funnel,
# csrf_cookie_domain, corrections) + ~9 M2 files surfaced by THIS
# scan need a future "Cluster-G" sub-sprint dispatch.
# ─────────────────────────────────────────────────────────────────────

