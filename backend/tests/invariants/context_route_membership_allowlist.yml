    handler: get_tenant_extractions
    gate_mechanism: "Depends(_require_superadmin)"
    justification: "Superadmin-gated; intentionally bypasses per-account membership (per file docstring at L1-15). Read-only count/timestamp data only — no LLM/chat/doc-body content."

  - file: backend/routers/admin_tenants.py
