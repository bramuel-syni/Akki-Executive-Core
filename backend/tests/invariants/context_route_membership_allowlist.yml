# AUDIT_P2.2 — `{context_id}` route membership-gate allowlist (audit-derived).
#
# This file is the explicit, justified register of every FastAPI route whose
# URL path contains `{context_id}` (and is therefore tenant-scoped) but whose
# handler does NOT use the canonical factory dep
# `Depends(require_context_membership(...))` or `Depends(require_role(...))`
# from `backend/services/rbac.py`.
#
# Any new route with `{context_id}` in its path that lacks BOTH a canonical
# factory dep AND an entry in this allowlist will fail the invariant scanner
# `test_context_route_membership_gate.py`. This is the explicit ratchet that
# AUDIT_P2.1 introduced — it prevents silent-omission IDOR/BOLA defects of
# the class that audit caught in `strategic_goal_evolution.py`.
#
# Each entry MUST document the *inline* gate mechanism the handler uses
# instead of the canonical factory, plus a 1-line justification. Adding an
# entry here is a documented, reviewed audit decision — NOT a routine code
# edit. PR reviewers should challenge new entries unless the justification
# is unambiguous.
#
# Categories of allowed non-factory gates (audit-derived, 2026-06-24):
#   - `_require_superadmin`      : Admin bypass (audited, superadmin-only)
#   - `_resolve_report_access`   : Tier-based report-access inline check
#                                  (author/reviewer chain, see cycle.py:880)
#   - `_verify_ned_context`      : NED-membership inline check (ned_cycle.py)
#   - sandbox owner-only filter  : `db.contexts.find_one({"id": context_id,
#                                  "owner_account_id": current["id"],
#                                  "type": "sandbox"})` — sandboxes are
#                                  owner-scoped, not membership-scoped.
#   - worker-stamp pattern       : doc-meta/summary/commentary/diff async
#                                  endpoints stamp `account_id=current["id"]`
#                                  on the queued job; worker re-validates
#                                  via the sync entry-point's contract.
#                                  ⚠ Subtle: input route does not membership-
#                                    gate before queueing. Flagged for a
#                                    deeper audit follow-up (see §9).
#
# Initial population (2026-06-24): 21 entries across 5 files.

entries:

