apiVersion: v1
kind: Service
metadata:
  name: akki
  labels: { app: akki, bounded-context: akki }
spec:
  type: ClusterIP
  selector: { app: akki }
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: akki
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: akki }
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
