apiVersion: v1
kind: Service
metadata:
  name: solva
  labels: { app: solva, bounded-context: solva }
spec:
  type: ClusterIP
  selector: { app: solva }
  ports:
    - name: http
      port: 8012
      targetPort: 8012
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: solva
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: solva }
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
