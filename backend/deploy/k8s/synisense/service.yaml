apiVersion: v1
kind: Service
metadata:
  name: synisense
  labels: { app: synisense, bounded-context: synisense }
spec:
  type: ClusterIP
  selector: { app: synisense }
  ports:
    - name: http
      port: 8011
      targetPort: 8011
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synisense
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synisense
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
